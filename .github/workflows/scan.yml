name: Scheduled market scan

# Server-side signal scan: discovery smoke (API/classification drift
# detector) + headless SMC scan of the top liquid stocks, published as a
# workflow artifact. Optional Telegram delivery runs only when
# TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID secrets are configured.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run smoke:discovery
      - run: npm run scan
        env:
          TOP_N: '5'
          # Cross-run continuity: persists signals/paper state to Supabase so
          # scheduled runs continue history instead of starting blank. When
          # the secrets below are absent the scan still runs statelessly.
          PERSIST: '1'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: npm run verify:paper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: scan-results.json
      - run: npm run alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
